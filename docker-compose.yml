services:

  postgres:
    image: postgres:17
    container_name: incident-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: incidentai
      POSTGRES_PASSWORD: incidentai
      POSTGRES_DB: order_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data: